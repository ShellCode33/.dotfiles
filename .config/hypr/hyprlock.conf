$bg_color = rgb(0x28, 0x28, 0x28)
$fg_color = rgb(0xfb, 0xf1, 0xc7)
$accent_color = rgb(0xb7, 0x1c, 0x1c)

background {
    path = ~/.local/share/wallpaper.jpg
    blur_passes = 1
}

# TIME
label {
  text = $TIME
  color = $fg_color
  font_size = 90
  position = 0, 100
  halign = center
  valign = center
}

# DATE
label {
  text = cmd[update:10000] date +"%A, %d %B %Y"
  color = $fg_color
  font_size = 25
  position = 0, 30
  halign = center
  valign = center
}

# PASSWORD FIELD
input-field {
  size = 300, 60
  rounding = 0
  font_color = $fg_color
  outer_color = $accent_color
  inner_color = $bg_color
  placeholder_text = <span><i> Logged in as </i><span>$USER</span></span>
  check_color = $accent_color
  fail_color = rgb(0xfb, 0x49, 0x34)
  fail_text = <b>Wrong password!</b>
  position = 0, -90
  halign = center
  valign = center
}

# INFO LABEL
label {
  text = cmd[update:1000] echo "$(if [ $(cat /sys/class/leds/input*::capslock/brightness | head -n 1) = 1 ]; then echo " Capslock enabled";fi)"
  color = $fg_color
  position = 0, -150
  halign = center
  valign = center
}
