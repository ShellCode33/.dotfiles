general {
  lock_cmd = pidof lock || pidof hyprlock || /usr/local/bin/lock --force
  before_sleep_cmd = loginctl lock-session
  # The lock wrapper is not recognized by auto mode: wait for the actual lock.
  inhibit_sleep = 3
  after_sleep_cmd = backlightctl --turn-on
}

listener {
    timeout = 530                                # 9min30s.
    on-timeout = backlightctl --brightness 1% && notify-send --urgency low 'Session is about to lock !'
    on-resume = backlightctl --auto
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 630                                 # 10min30s
    on-timeout = backlightctl --turn-off          # screen off when timeout has passed
    on-resume = backlightctl --turn-on            # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
