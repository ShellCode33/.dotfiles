<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<alias>
		<family>Font Awesome</family>
		<prefer>
			<family>Font Awesome 7 Free</family>
		</prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer>
      <family>JetBrains Mono</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
      <family>JetBrains Mono</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome</family>
		</prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer>
      <family>JetBrains Mono</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
      <family>JetBrains Mono</family>
			<family>Noto Color Emoji</family>
			<family>Font Awesome</family>
		</prefer>
	</alias>

</fontconfig>
